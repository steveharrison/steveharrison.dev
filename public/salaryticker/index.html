<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salary Ticker</title>
  <meta name="description" content="A tiny macOS menubar app that shows how much you've earned so far today.">
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #fff;
      color: #111;
      display: flex;
      justify-content: center;
      padding: 96px 24px;
    }
    main {
      width: 100%;
      max-width: 640px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p.tagline {
      font-size: 1.125rem;
      color: #555;
      line-height: 1.6;
      max-width: 46ch;
    }
    video.demo {
      width: 100%;
      max-width: 470px;
      height: auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    }
    img.settings {
      width: 100%;
      max-width: 487px;
      height: auto;
      display: block;
      /* The capture has the window shadow and clear padding baked in,
         so pull the surrounding gaps in a little. */
      margin: -24px 0;
    }
    a.download {
      display: inline-block;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 10px;
    }
    a.download:hover { background: #333; }
    .fine-print {
      font-size: 0.8rem;
      color: #999;
    }
  </style>
</head>
<body>
  <main>
    <h1>Salary Ticker</h1>
    <p class="tagline">A tiny macOS menubar app that shows how much you've earned so far today, ticking up in real time.</p>

    <video class="demo" src="demo.mp4" autoplay loop muted playsinline></video>

    <img class="settings" src="settings.png" alt="Salary Ticker settings window: daily pay, day start and end times, and automatic masking while screen sharing">

    <a class="download" href="SalaryTicker.zip" download>Download for macOS</a>
    <p class="fine-print">Free · macOS 13 or later</p>
  </main>
</body>
</html>
